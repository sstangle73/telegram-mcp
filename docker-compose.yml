# The Telegram MCP server on your own machine or server, on 127.0.0.1:8790 only: for claude.ai, put HTTPS in front
# (a reverse proxy or a tunnel) and set PUBLIC_URL to that address (README, Deploy, option C). Secrets: .env (API_ID,
# API_HASH, and sign-in's or AUTH_TOKEN) and ./data/session.txt from login.py, or TELEGRAM_SESSION in .env.
name: telegram-mcp

services:
  telegram-mcp:
    build: .
    image: telegram-mcp:local
    container_name: telegram-mcp
    restart: unless-stopped
    env_file:
      - .env
      - path: data/signin.env   # setup_signin.py's sign-in secrets, once you've made them
        required: false
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8790:8000"   # loopback only
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
